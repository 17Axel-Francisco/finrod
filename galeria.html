<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrusel de Imágenes</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; }

    .carousel-container {
      position: relative;
      max-width: 700px;
      margin: auto;
      overflow: hidden;
    }

    .carousel-slide {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .carousel-slide img {
      width: 100%;
      flex-shrink: 0;
    }

    .prev, .next {
      cursor: pointer;
      position: absolute;
      top: 50%;
      width: auto;
      padding: 16px;
      margin-top: -22px;
      color: white;
      font-weight: bold;
      font-size: 20px;
      border: none;
      background-color: rgba(0,0,0,0.5);
      user-select: none;
      transition: 0.3s;
    }

    .prev:hover, .next:hover {
      background-color: rgba(0,0,0,0.8);
    }

    .prev { left: 0; }
    .next { right: 0; }
  </style>
</head>
<body>

<div class="carousel-container">
  <div class="carousel-slide" id="carousel-slide">
    <img src="img/1.jpeg" alt="Imagen 1">
    <img src="img/2.jpeg" alt="Imagen 1">
    <img src="img/3.jpeg" alt="Imagen 1">
    <img src="img/4.jpeg" alt="Imagen 2">
    <img src="img/5.jpeg" alt="Imagen 3">
    <img src="img/6.jpeg" alt="Imagen 4">
  </div>
  <button class="prev" onclick="moverCarrusel(-1)">❮</button>
  <button class="next" onclick="moverCarrusel(1)">❯</button>
</div>

<script>
  const slide = document.getElementById('carousel-slide');
  const images = slide.getElementsByTagName('img');
  let currentIndex = 0;

  function mostrarImagen(index) {
    if (index >= images.length) currentIndex = 0;
    else if (index < 0) currentIndex = images.length - 1;
    else currentIndex = index;

    slide.style.transform = 'translateX(' + (-currentIndex * 100) + '%)';
  }

  function moverCarrusel(dir) {
    mostrarImagen(currentIndex + dir);
  }

  // Carrusel automático cada 5 segundos
  setInterval(() => moverCarrusel(1), 5000);
</script>

</body>
